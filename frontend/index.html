<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BlockTask - Blockchain Task Manager</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --line:#334155; --txt:#e2e8f0; --mute:#94a3b8; --acc:#6366f1; --ok:#22c55e; --bad:#ef4444; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--txt); }
  header { display:flex; justify-content:space-between; align-items:center; padding:16px 24px; border-bottom:1px solid var(--line); flex-wrap:wrap; gap:8px; }
  h1 { margin:0; font-size:22px; } h1 span { color:var(--acc); }
  button { background:var(--acc); color:#fff; border:0; padding:8px 14px; border-radius:6px; cursor:pointer; font-size:14px; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--txt); }
  button.danger { background:var(--bad); } button.ok { background:var(--ok); }
  main { max-width:1000px; margin:0 auto; padding:20px; display:grid; gap:20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; }
  h2 { margin:0 0 12px; font-size:16px; }
  form { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  form .full { grid-column:1/-1; }
  input, select, textarea { width:100%; padding:8px; background:var(--bg); border:1px solid var(--line); color:var(--txt); border-radius:6px; font:inherit; }
  label { font-size:12px; color:var(--mute); display:block; margin-bottom:3px; }
  .task { border:1px solid var(--line); border-radius:8px; padding:12px; margin-bottom:10px; display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .task.done .title { text-decoration:line-through; color:var(--mute); }
  .title { font-weight:600; } .meta { font-size:12px; color:var(--mute); margin-top:4px; }
  .badge { font-size:11px; padding:2px 8px; border-radius:99px; margin-right:6px; }
  .p0 { background:#1d4ed8; } .p1 { background:#b45309; } .p2 { background:#b91c1c; }
  .actions { display:flex; gap:6px; align-items:flex-start; flex-wrap:wrap; }
  .log { font-family:ui-monospace, monospace; font-size:12px; color:var(--mute); padding:4px 0; border-bottom:1px dashed var(--line); }
  #status { font-size:13px; color:var(--mute); }
  @media (max-width:600px){ form{grid-template-columns:1fr;} }
</style>
</head>
<body>
<header>
  <h1>Block<span>Task</span></h1>
  <div><span id="status">Not connected</span> <button id="connect">Connect MetaMask</button></div>
</header>
<main>
  <section class="card">
    <h2>Create a task</h2>
    <form id="form">
      <div class="full"><label>Title</label><input id="title" required></div>
      <div class="full"><label>Description</label><textarea id="desc" rows="2"></textarea></div>
      <div><label>Priority</label>
        <select id="prio"><option value="0">Low</option><option value="1" selected>Medium</option><option value="2">High</option></select></div>
      <div><label>Due date (optional)</label><input id="due" type="datetime-local"></div>
      <div class="full"><button type="submit">Add task (on-chain)</button></div>
    </form>
  </section>

  <section class="card">
    <h2>My tasks</h2>
    <div id="tasks">Connect your wallet to view tasks.</div>
  </section>

  <section class="card">
    <h2>Activity log (immutable events)</h2>
    <div id="log"></div>
  </section>
</main>

<script src="ethers.umd.min.js"></script>
<script src="contract.js"></script>
<script>
const PRIO = ["Low", "Medium", "High"];
let provider, signer, contract, account;
const $ = (id) => document.getElementById(id);

const short = (a) => a.slice(0, 6) + "..." + a.slice(-4);
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = (ts) => Number(ts) ? new Date(Number(ts) * 1000).toLocaleString() : "-";

async function tx(promise) {
  try {
    $("status").textContent = "Waiting for confirmation...";
    const t = await promise; await t.wait();
    $("status").textContent = "Connected: " + short(account);
    await refresh();
  } catch (e) {
    $("status").textContent = "Error: " + (e.reason || e.shortMessage || e.message);
  }
}

$("connect").onclick = async () => {
  if (!window.ethereum) return alert("Please install MetaMask");
  provider = new ethers.BrowserProvider(window.ethereum);
  await provider.send("eth_requestAccounts", []);
  signer = await provider.getSigner();
  account = await signer.getAddress();
  contract = new ethers.Contract(window.BLOCKTASK.address, window.BLOCKTASK.abi, signer);
  $("status").textContent = "Connected: " + short(account);
  $("connect").textContent = "Connected";
  window.ethereum.on("accountsChanged", () => location.reload());
  await refresh();
};

$("form").onsubmit = async (e) => {
  e.preventDefault();
  const due = $("due").value ? Math.floor(new Date($("due").value).getTime() / 1000) : 0;
  if (!contract) return alert("Connect wallet first");
  await tx(contract.createTask($("title").value, $("desc").value, Number($("prio").value), due));
  e.target.reset();
};

async function refresh() {
  const list = await contract.getTasksFor(account);
  const box = $("tasks");
  if (!list.length) box.textContent = "No tasks yet.";
  else box.innerHTML = list.map(t => {
    const done = Number(t.status) === 1;
    const mine = t.creator.toLowerCase() === account.toLowerCase();
    return `<div class="task ${done ? "done" : ""}">
      <div>
        <div class="title">#${t.id} ${esc(t.title)}</div>
        <div>${esc(t.description)}</div>
        <div class="meta"><span class="badge p${t.priority}">${PRIO[t.priority]}</span>
          Creator: ${short(t.creator)} | Assignee: ${short(t.assignee)} | Due: ${fmt(t.dueDate)} | ${done ? "Completed " + fmt(t.completedAt) : "Pending"}</div>
      </div>
      <div class="actions">
        ${!done ? `<button class="ok" data-a="done" data-id="${t.id}">Complete</button>` : ""}
        ${mine && !done ? `<button class="ghost" data-a="assign" data-id="${t.id}">Assign</button>` : ""}
        ${mine ? `<button class="danger" data-a="del" data-id="${t.id}">Delete</button>` : ""}
      </div></div>`;
  }).join("");
  await loadLog();
}

$("tasks").onclick = async (e) => {
  const b = e.target.closest("button"); if (!b) return;
  const id = b.dataset.id;
  if (b.dataset.a === "done") await tx(contract.completeTask(id));
  if (b.dataset.a === "del") await tx(contract.deleteTask(id));
  if (b.dataset.a === "assign") {
    const addr = prompt("Wallet address to assign this task to:");
    if (addr) await tx(contract.assignTask(id, addr));
  }
};

async function loadLog() {
  const evs = await contract.queryFilter("*", 0, "latest");
  const lines = evs.reverse().map(ev => {
    const a = ev.args;
    let msg = ev.fragment.name + " #" + a[0];
    if (ev.fragment.name === "TaskCreated") msg += ` by ${short(a[1])} "${a[2]}"`;
    if (ev.fragment.name === "TaskAssigned") msg += ` -> ${short(a[2])}`;
    if (ev.fragment.name === "TaskCompleted" || ev.fragment.name === "TaskDeleted") msg += ` by ${short(a[1])}`;
    return `<div class="log">block ${ev.blockNumber} | ${esc(msg)} | tx ${ev.transactionHash.slice(0, 12)}...</div>`;
  });
  $("log").innerHTML = lines.join("") || "No events yet.";
}
</script>
</body>
</html>
